apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zeron-relay-web
  labels:
    app: zeron-relay
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`__PUBLIC_HOST__`)
      kind: Rule
      middlewares:
        - name: zeron-relay-https-redirect
      services:
        - name: zeron-relay
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zeron-relay-websecure
  labels:
    app: zeron-relay
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`__PUBLIC_HOST__`)
      kind: Rule
      middlewares:
        - name: zeron-relay-security-headers
        - name: zeron-relay-rate-limit
      services:
        - name: zeron-relay
          port: 8080
  tls:
    secretName: zeron-relay-tls

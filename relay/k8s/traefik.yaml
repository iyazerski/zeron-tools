apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zeron-relay-https-redirect
  labels:
    app: zeron-relay
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zeron-relay-security-headers
  labels:
    app: zeron-relay
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    browserXssFilter: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    referrerPolicy: no-referrer
---
# Per client IP. The app polls about twice a second per open chat.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zeron-relay-rate-limit
  labels:
    app: zeron-relay
spec:
  rateLimit:
    average: 20
    burst: 60

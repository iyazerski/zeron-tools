apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeron-relay
  labels:
    app: zeron-relay
spec:
  replicas: 1
  # One process owns state.json and the Mac links: never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zeron-relay
  template:
    metadata:
      labels:
        app: zeron-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: zeron-relay
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: https://__PUBLIC_HOST__
            - name: DATA_DIR
              value: /data
            # Only needed until the first passkey exists.
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zeron-relay-secrets
                  key: SETUP_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeron-relay-data

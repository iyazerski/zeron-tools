[package]
name = "zeron-tools"
version = "0.8.0"
edition = "2024"
publish = false
description = "Offline maintenance tools for Zeron: sync, import, export, rename, archive, and delete chats"

[dependencies]
# Zeron's crates are not on crates.io; pin them to the release we target
# (the same version as `zeron_version!` in src/zeron.rs).
zeron-doc = { git = "https://github.com/zeronsh/zeron", tag = "v0.2.114" }
zeron-sync = { git = "https://github.com/zeronsh/zeron", tag = "v0.2.114" }
zeron-proto = { git = "https://github.com/zeronsh/zeron", tag = "v0.2.114" }
zeron-mcp = { git = "https://github.com/zeronsh/zeron", tag = "v0.2.114" }
# Versions match Zeron's workspace so cargo unifies them.
loro = "1.13"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "zeron-tools"
version = "0.14.3"
edition = "2024"
publish = false
description = "Background services for Zeron: archive old chats, title untitled ones, link the running app to a relay for phone access, and show its chats in a floating window"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
# Starts macOS dictation from the composer's button.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
# Finds inline code in the transcript's Markdown, to colour it.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "net", "process", "sync", "time"] }
# The relay link and Zeron's IPC.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite leaves the TLS crypto provider to the app; with only
# `ring` enabled, rustls picks it on its own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The companion window. Rune is pre-release and changes often: keep one
# tested revision.
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }
# Shrinks image thumbnails before Rune keeps them; matches Rune's own image build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeron-relay-proto = { path = "relay-proto" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace]
members = [".", "relay", "relay-proto"]

# A panic exits the process, so launchd or Kubernetes restarts it, rather
# than leaving it running with a poisoned lock and failing every call.
[profile.release]
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

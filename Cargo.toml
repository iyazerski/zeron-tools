[package]
name = "zeron-tools"
version = "0.11.5"
edition = "2024"
publish = false
description = "A background service for Zeron: archive old chats, title untitled ones, and link the running app to a relay for phone access"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time"] }
# The relay link and Zeron's IPC.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite leaves the TLS crypto provider to the app; with only
# `ring` enabled, rustls picks it on its own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeron-relay-proto = { path = "relay-proto" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace]
members = [".", "relay", "relay-proto"]

# A panic exits the process, so launchd or Kubernetes restarts it, rather
# than leaving it running with a poisoned lock and failing every call.
[profile.release]
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

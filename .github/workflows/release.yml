name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    # Zeron ships on macOS for Apple silicon only.
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TARGET: aarch64-apple-darwin
      ASSET: zeron-tools-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Validate release tag
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
      - name: Build binary
        run: cargo build --release --locked --target "$TARGET"
      - name: Test binary
        run: target/$TARGET/release/zeron-tools --version
      - name: Package binary
        run: |
          mkdir dist
          tar -C "target/$TARGET/release" -czf "dist/$ASSET" zeron-tools
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --title "zeron-tools $GITHUB_REF_NAME" \
              --verify-tag
          fi
